<style>
:root {
  --bg: #f4f2ec;
  --card: #ffffff;
  --ink: #1c1d21;
  --soft: #6b6a66;
  --line: #dcd8cf;
  --accent: #2f5bd3;
  --accent-soft: #e6ecfb;
  --good: #1d8a4e;
  --good-soft: #e3f4ea;
  --bad: #c2412d;
  --bad-soft: #fbe9e5;
  --warn: #a8690f;
  --warn-soft: #fbf0dc;
  --mono: ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 22px/1.4 system-ui, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
button:disabled { cursor: default; opacity: .4; }
/* The page is laid out at 1280 wide and scaled to fit the window, so nothing is cut off on any screen. */
#app { height: 100vh; padding-top: 56px; display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; overflow-y: auto; }
#fit { flex: none; width: 1280px; padding: 0 40px 24px; display: flex; flex-direction: column; align-items: center; transform-origin: top center; }
.stage { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
.row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; }
.col { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 28px; }
.big { font-size: 64px; line-height: 1.2; }
.huge { font-size: 96px; line-height: 1.1; }
.muted { color: var(--soft); }
.small { font-size: 17px; }
.hidden { display: none !important; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.btn svg { width: 22px; height: 22px; }
.icon { width: 52px; height: 52px; padding: 0; justify-content: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 4px; gap: 4px; }
.seg button { padding: 8px 20px; border-radius: 999px; font-weight: 600; }
.seg button.on { background: var(--ink); color: #fff; }

/* Algebra */
/* Algebra is typeset by KaTeX with its own fonts, so bars span and stack the same on every machine. */
.alg { display: inline-block; white-space: nowrap; }
.alg .katex { font-size: 1.1em; }

/* Expression input */
.ex { display: flex; flex-direction: column; gap: 10px; }
.ex-line { display: flex; gap: 10px; align-items: center; }
.ex-in { flex: 1; min-width: 320px; padding: 12px 16px; border: 2px solid var(--line); border-radius: 12px; background: #fff; font-family: var(--mono); font-size: 22px; }
.ex-in:focus { outline: none; border-color: var(--accent); }
.mx { display: flex; align-items: center; min-height: 58px; cursor: text; font-family: inherit; }
.mx .katex { font-size: 30px; }
.tt th .mx { min-height: 48px; }
.tt th .mx .katex { font-size: 24px; }
.mx .caret { color: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pal button svg { width: 22px; height: 22px; vertical-align: middle; }
.ex.bad .ex-in { border-color: var(--bad); }
.err { color: var(--bad); font-size: 18px; }
.pal { display: flex; gap: 6px; flex-wrap: wrap; }
.pal button { min-width: 48px; padding: 8px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); font-family: var(--mono); font-size: 19px; font-weight: 600; }
.pal button.v { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.pal button:hover { border-color: var(--ink); }
.pal .gap { width: 10px; }
.ex-done { display: inline-flex; align-items: center; gap: 14px; padding: 6px 14px; border-radius: 12px; cursor: text; }
.ex-done:hover { background: var(--accent-soft); }

/* Tables */
table.tt { border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.tt th, .tt td { padding: 10px 22px; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
.tt tr:last-child td { border-bottom: 0; }
.tt th:last-child, .tt td:last-child { border-right: 0; }
.tt th { font-weight: 500; font-size: 28px; background: #faf9f6; vertical-align: bottom; }
.tt td { font-size: 30px; font-variant-numeric: tabular-nums; min-width: 84px; height: 62px; }
.tt td.in { color: var(--soft); }
.tt td.fruitcell { font-size: 36px; letter-spacing: 4px; background: #faf9f6; min-width: 120px; }
.tt th.fruithead { font: 600 18px system-ui, sans-serif; color: var(--soft); }
.tt td.cell { cursor: pointer; }
.tt td.cell:hover { background: var(--accent-soft); }
.tt td.ro { cursor: default; }
.tt td.ro:hover { background: none; }
.tt .match { background: var(--good-soft) !important; color: var(--good); }
.tt .target { background: #f3f1ea; }
.tt th.add { padding: 0; }
.tt th.add button { width: 56px; height: 56px; font-size: 32px; color: var(--accent); }
.tt th .x { display: block; margin: 6px auto 0; color: var(--soft); padding: 4px; border-radius: 6px; line-height: 0; }
.tt th .x svg, button[data-act="exdel"] svg { width: 20px; height: 20px; }
.tt th .fill { display: block; margin: 6px auto 0; color: var(--accent); padding: 4px; border-radius: 6px; line-height: 0; }
.tt th .fill:hover { background: var(--accent-soft); }
/* Column buttons sit in a strip along the top of the heading, so every heading's text lines up along the bottom. */
.tt th { position: relative; }
.tt th .hacts { position: absolute; top: 6px; left: 0; right: 0; display: flex; justify-content: center; gap: 2px; }
.tt th .hacts:empty { display: none; }
.tt th .hacts .x, .tt th .hacts .fill { display: inline-flex; margin: 0; }
.tt tr:has(.hacts:not(:empty)) > th { padding-top: 42px; }
.tt th .fill svg { width: 20px; height: 20px; }
/* A faded column: the teacher has set it aside so the class looks at the others. */
.tt td.dimcol, .tt th.dimcol > :not(.hacts) { opacity: .22; }
.tt th .dimb { color: var(--soft); }
.tt th .x:hover { color: var(--bad); background: var(--bad-soft); }
.tt th .ex-done { font-size: 28px; }
.tt td.add { background: #faf9f6; min-width: 0; padding: 0; }
.tt th .ex-in { min-width: 220px; font-size: 18px; padding: 8px 10px; }
.tt th .pal button { min-width: 38px; padding: 4px 8px; font-size: 16px; }
.tt th .ex { align-items: stretch; }

/* Warm-up */
.decals { display: flex; gap: 36px; justify-content: center; }
.decal { width: 260px; height: 260px; border-radius: 32px; background: var(--card); border: 1px solid var(--line); display: grid; place-items: center; font-size: 150px; line-height: 1; overflow: hidden; position: relative; }
.decal img { width: 88%; height: 88%; object-fit: contain; }
.decal .fb { display: none; font-size: 30px; font-weight: 700; color: #fff; padding: 12px; text-align: center; }
.decal.nf img { display: none; }
.decal.nf .fb { display: block; }
.decal.nf { border: 0; background: var(--c); }
.decal.named { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
.decal.named .em { font-size: 124px; line-height: 1; }
.decal .name { font-size: 30px; font-weight: 700; line-height: 1; }
#board { touch-action: none; }

/* Predict */
.basket { display: flex; gap: 28px; min-width: 360px; min-height: 180px; padding: 20px 36px; border-radius: 28px; border: 3px dashed var(--line); justify-content: center; align-items: center; font-size: 120px; }
.legend { display: flex; gap: 40px; font-size: 32px; }
.legend > span { display: inline-flex; align-items: center; gap: 12px; }
.lfruit, .bfruit { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; line-height: 1; }
.lfruit .name { font-size: 16px; font-weight: 700; }
.bfruit { gap: 12px; }
.bfruit .name { font-size: 28px; font-weight: 700; }
.tf { display: flex; gap: 24px; }
.tf button { min-width: 220px; padding: 22px 32px; font-size: 34px; font-weight: 700; border-radius: 20px; background: var(--card); border: 2px solid var(--line); }
.tf button.pick { border-color: var(--ink); background: var(--ink); color: #fff; opacity: 1; }
.tf button:disabled:not(.pick) { opacity: .35; }
.bars { display: flex; flex-direction: column; gap: 14px; width: 640px; }
.barrow { display: grid; grid-template-columns: 110px 1fr 70px; align-items: center; gap: 16px; font-size: 28px; font-weight: 600; }
.barrow .track { height: 40px; border-radius: 10px; background: #ebe8e0; overflow: hidden; }
.barrow .fill { height: 100%; background: var(--accent); border-radius: 10px; }
.barrow .n { text-align: right; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 10px; }
.dots button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-weight: 700; }
.dots button.on { border-color: var(--ink); background: var(--ink); color: #fff; }
.dots button.done { border-color: var(--good); color: var(--good); }
.dots button.on.done { background: var(--good); color: #fff; }
.dots button.extra { border-style: dashed; }
.stat { display: inline-flex; align-items: baseline; gap: 8px; }
.stat b { font-size: 34px; font-variant-numeric: tabular-nums; }
.stat > span { font-size: 17px; color: var(--soft); }
.of { font-weight: 400; color: var(--soft); }

/* Circuits */
svg.circ { display: block; }
svg.circ .body { fill: #fff; stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
svg.circ .lead { stroke: var(--ink); stroke-width: 3; }
svg.circ .wire { fill: none; stroke: var(--ink); stroke-width: 3; }
svg.circ .wire.hit { stroke: transparent; stroke-width: 18; cursor: pointer; }
svg.circ .wire.live { stroke: var(--accent); }
/* Clicking a wire removes it, so hovering one turns it red. */
svg.circ .wire.hit:hover + .wire { stroke: var(--bad); stroke-dasharray: 8 6; }
svg.circ .port { fill: #b7c1d4; stroke: transparent; stroke-width: 12; }
svg.circ .port.io { cursor: crosshair; }
svg.circ .port.io:hover { fill: var(--accent); }
svg.circ .lbl { font: italic 30px "Cambria Math", "Times New Roman", serif; fill: var(--ink); }
/* Gate labels: a light fill per gate type with its name in dark bold text, readable on a projector. */
svg.circ .gt-OR .body, svg.circ .gt-NOR .body { fill: #ffe1a6; }
svg.circ .gt-AND .body { fill: #c9dcff; }
svg.circ .gt-NOT .body { fill: #f7cde9; }
svg.circ .gname { font: 800 15px system-ui, sans-serif; fill: #1c1d21; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
svg.circ .gname.small { font-size: 12px; }
svg.circ .glabel { font: 700 15px system-ui, sans-serif; fill: var(--soft); letter-spacing: .06em; }
svg.circ .gate { cursor: grab; }
svg.circ .gate:active { cursor: grabbing; }
.builder { display: flex; gap: 28px; align-items: flex-start; }
.board { background: var(--card); border: 1px solid var(--line); border-radius: 18px; position: relative; }
.palette { position: absolute; left: 16px; top: 16px; display: flex; gap: 10px; padding: 8px; border-radius: 14px; background: #f7f6f2; border: 1px solid var(--line); }
.palette .pg { width: 96px; height: 64px; border-radius: 10px; display: grid; place-items: center; cursor: grab; background: #fff; border: 1px solid var(--line); touch-action: none; }
.palette.trash { background: var(--bad-soft); border-color: var(--bad); }
.solved table.tt { border-color: var(--good); box-shadow: 0 0 0 3px var(--good); }

/* Passwords */
.pwwrap { display: grid; grid-template-columns: 420px 1fr; gap: 28px; width: 100%; align-items: start; }
.form { display: flex; flex-direction: column; gap: 18px; }
.form label { font-weight: 600; font-size: 19px; display: flex; flex-direction: column; gap: 6px; }
.form label small { font-weight: 400; color: var(--soft); font-size: 16px; }
.form input { padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.form input:focus { outline: none; border-color: var(--accent); }
.result { border-radius: 12px; padding: 14px 16px; font-size: 19px; }
.result b { display: block; font-size: 22px; }
.result.fail { background: var(--bad-soft); color: var(--bad); }
.result.ok { background: var(--good-soft); color: var(--good); }
.result.none { background: #ebe8e0; color: var(--soft); }
.helper { width: 100%; border-radius: 14px; border: 1px solid var(--line); background: #1e2129; overflow: hidden; }
.helper button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 16px; color: #e8e6df; text-align: left; }
.helper button svg { width: 20px; height: 20px; flex: none; transition: transform .15s; }
.helper.open button svg { transform: rotate(90deg); }
.helper .hlx { margin: 0; font: 19px/1.55 var(--mono); tab-size: 4; white-space: pre; color: #e8e6df; }
.helper .body { padding: 0 20px 14px 46px; }
.helper .dim { color: #7f848e; }
.result ul { margin: 6px 0 0; padding-left: 22px; }
/* The textarea is transparent and sits over a highlighted copy of the same text, kept in step on every change and scroll. */
.codewrap { position: relative; width: 100%; height: 470px; border-radius: 14px; border: 1px solid var(--line); background: #1e2129; overflow: hidden; }
.codewrap:focus-within { outline: 3px solid var(--accent-soft); }
.code, .hl { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 18px 20px; border: 0; font: 19px/1.55 var(--mono); tab-size: 4; white-space: pre; overflow: auto; }
.code { resize: none; background: transparent; color: transparent; caret-color: #e8e6df; outline: none; }
.code::selection { background: rgba(97, 175, 239, .35); }
.hl { color: #e8e6df; pointer-events: none; overflow: hidden; }
:is(.hl, .hlx) .k { color: #c678dd; }
:is(.hl, .hlx) .s { color: #98c379; }
:is(.hl, .hlx) .c { color: #7f848e; font-style: italic; }
:is(.hl, .hlx) .c b { color: #e5c07b; font-style: normal; }
:is(.hl, .hlx) .n { color: #d19a66; }
:is(.hl, .hlx) .b { color: #61afef; }
:is(.hl, .hlx) .f { color: #61afef; }
.pyerr { background: var(--bad-soft); color: var(--bad); padding: 12px 16px; border-radius: 12px; font: 17px/1.4 var(--mono); white-space: pre-wrap; }

/* Practice */
.prac { display: grid; grid-template-columns: 1fr; gap: 22px; width: 100%; max-width: 980px; }
.lines { display: flex; flex-direction: column; gap: 4px; }
.pline { display: grid; grid-template-columns: 1fr 230px 36px; align-items: center; gap: 16px; padding: 12px 18px; border-radius: 12px; font-size: 34px; }
.pline.start { background: #f7f6f2; }
.pline .law { font-size: 17px; color: var(--soft); }
.pline .ok { color: var(--good); font-weight: 700; }
.draft { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 14px; border: 2px dashed var(--line); }
.draft .ex-line select { padding: 12px 10px; border-radius: 12px; border: 2px solid var(--line); background: #fff; font-size: 19px; }
.fbk { border-radius: 12px; padding: 12px 16px; font-size: 19px; }
.fbk.bad { background: var(--bad-soft); color: var(--bad); }
.fbk.warn { background: var(--warn-soft); color: var(--warn); }
.fbk.good { background: var(--good-soft); color: var(--good); }
.donecard { border-color: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
table.sum { border-collapse: collapse; width: 100%; font-size: 22px; }
.sum td, .sum th { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.sum th { font-size: 16px; color: var(--soft); font-weight: 600; }
.sum td.n { font-variant-numeric: tabular-nums; font-weight: 700; text-align: right; }
.mark { font-weight: 800; font-size: 24px; text-align: center; }
.mark.y { color: var(--good); }
.mark.n { color: var(--bad); }
.mark.e { color: var(--warn); }

/* Conclusion */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; }
.tcard { min-height: 280px; border-radius: 22px; background: var(--card); border: 1px solid var(--line); padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 18px; font-size: 28px; font-weight: 600; text-align: center; }
.tcard.back { background: repeating-linear-gradient(135deg, #e9e5da 0 14px, #f1eee6 14px 28px); border-color: #e0dbcf; font-size: 56px; color: #b8b1a1; }
button.tcard { cursor: pointer; }
.tcard .alg { font-size: 34px; font-weight: 400; }

/* NOR half: the target circuit and its tags */
.cmp { display: flex; align-items: center; gap: 22px; }
.ccard { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
.ccard.goal { border: 3px solid var(--accent); background: var(--accent-soft); }
.ccard .ctag { align-self: flex-start; }
.ccard .cexpr { font-size: 48px; padding: 24px 20px 32px; }
.ctag { display: inline-block; font: 800 22px/1.2 system-ui, sans-serif; padding: 2px 12px; border-radius: 8px; border: 2px solid var(--ink); }
.ctag.goal { background: var(--accent); border-color: var(--accent); color: #fff; }
.eqq { font-size: 64px; font-weight: 300; color: var(--soft); }
.tt .goalcol { background: var(--accent-soft); }

/* Numbered options: the number sits outside the choice, big enough to call out across a room */
.opt { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.onum { display: grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--ink); color: #fff; font: 800 34px/1 system-ui, sans-serif; }


/* De Morgan's theorem, shown under the NOR table once the class has found it. */
.theorem { font-size: 52px; padding: 8px 24px; }

/* The student's lesson recap in the conclusion. */

// Boolean expression engine: parse word form, render algebra, compare, check identity steps.
const Bool = (() => {
  const WORDS = { NOT: "NOT", AND: "AND", OR: "OR" };

  function tokenize(text) {
    const out = [];
    const s = String(text || "");
    let i = 0;
    while (i < s.length) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === "(" || c === ")") { out.push(c); i++; continue; }
      if (c === "+" ) { out.push("OR"); i++; continue; }
      if (c === "." || c === "*" || c === "⋅" || c === "·" || c === "&") { out.push("AND"); i++; continue; }
      if (c === "'") { out.push("BAR"); i++; continue; }
      if (c === "!" || c === "~") { out.push("NOT"); i++; continue; }
      if (c === "|") { out.push("OR"); i++; continue; }
      if (c === "0" || c === "1") { out.push(c); i++; continue; }
      if (/[A-Za-z]/.test(c)) {
        let j = i;
        while (j < s.length && /[A-Za-z]/.test(s[j])) j++;
        const w = s.slice(i, j).toUpperCase();
        if (WORDS[w]) out.push(w);
        else if (w.length === 1) out.push({ v: w });
        else return { error: "word", word: s.slice(i, j) };
        i = j;
        continue;
      }
      return { error: "char", word: c };
    }
    return { tokens: out };
  }

  function parse(text, allowed) {
    const tk = tokenize(text);
    if (tk.error) return { error: "Unknown symbol " + tk.word };
    const t = tk.tokens;
    if (!t.length) return { error: "empty" };
    let p = 0;
    const peek = () => t[p];
    function orExpr() {
      let a = andExpr();
      while (peek() === "OR") { p++; a = { t: "or", a, b: andExpr() }; }
      return a;
    }
    function andExpr() {
      let a = notExpr();
      while (peek() === "AND") { p++; a = { t: "and", a, b: notExpr() }; }
      return a;
    }
    function notExpr() {
      if (peek() === "NOT") { p++; return { t: "not", a: notExpr() }; }
      // A bar is written after the thing it covers: A' is a bar over A, (A + B)' a bar over A + B.
      let a = atom();
      while (peek() === "BAR") { p++; a = { t: "not", a }; }
      return a;
    }
    function atom() {
      const k = peek();
      if (k === undefined) throw "end";
      if (k === "(") {
        p++;
        const a = orExpr();
        if (peek() !== ")") throw "close";
        p++;
        return { t: "grp", a };
      }
      if (k === "0" || k === "1") { p++; return { t: "c", v: +k }; }
      if (typeof k === "object") {
        if (allowed && !allowed.includes(k.v)) throw "var:" + k.v;
        p++;
        return { t: "v", v: k.v };
      }
      throw "tok:" + k;
    }
    try {
      const ast = orExpr();
      if (p < t.length) return { error: t[p] === ")" ? "Extra )" : "Something is missing between terms" };
      return { ast };
    } catch (e) {
      if (e === "end") return { error: "Expression ends too early" };
      if (e === "close") return { error: "Missing )" };
      if (String(e).startsWith("var:")) return { error: "Use only " + allowed.join(", ") };
      return { error: "Something is missing between terms" };
    }
  }

  const strip = (n) => {
    if (n.t === "grp") return strip(n.a);
    if (n.t === "not") return { t: "not", a: strip(n.a) };
    if (n.t === "and" || n.t === "or") return { t: n.t, a: strip(n.a), b: strip(n.b) };
    return n;
  };

  function key(n) {
    switch (n.t) {
      case "v": return n.v;
      case "c": return String(n.v);
      case "not": return "~" + key(n.a);
      case "and": return "&(" + key(n.a) + "," + key(n.b) + ")";
      case "or": return "|(" + key(n.a) + "," + key(n.b) + ")";
      case "grp": return key(n.a);
    }
  }

  function sortedKey(n) {
    switch (n.t) {
      case "v": return n.v;
      case "c": return String(n.v);
      case "grp": return sortedKey(n.a);
      case "not": return "~" + sortedKey(n.a);
      default: {
        const ks = [sortedKey(n.a), sortedKey(n.b)].sort();
        return (n.t === "and" ? "&(" : "|(") + ks.join(",") + ")";
      }
    }
  }

    if (n.t === "v") set.add(n.v);
    else if (n.a) { vars(n.a, set); if (n.b) vars(n.b, set); }

  }

    switch (n.t) {
      case "v": return env[n.v] ? 1 : 0;

      case "not": return 1 - evalAt(n.a, env);
      case "and": return evalAt(n.a, env) & evalAt(n.b, env);
      case "or": return evalAt(n.a, env) | evalAt(n.b, env);
    }

    const vs = [...new Set([...vars(x), ...vars(y)])];

      const env = {};

      if (evalAt(x, env) !== evalAt(y, env)) return false;
    }
    return true;
  }

    if (n.t === "v" || n.t === "c") return 1;
    if (n.t === "grp") return size(n.a);
    if (n.t === "not") return size(n.a);
    return size(n.a) + size(n.b);
  }

  // True when every bar sits on a single variable or constant.
  function barsOnLetters(n) {
    if (n.t === "grp") return barsOnLetters(n.a);
    if (n.t === "not") { const a = strip(n.a); return a.t === "v" || a.t === "c"; }
    if (n.t === "and" || n.t === "or") return barsOnLetters(n.a) && barsOnLetters(n.b);
    return true;
  }

  function words(n, parent) {

      case "v": return n.v;
      case "c": return String(n.v);
      case "grp": return "(" + words(n.a) + ")";
      case "not": {
        const a = n.a;
        if (a.t === "and" || a.t === "or") return "NOT (" + words(a) + ")";
        return "NOT " + words(a);
      }
      case "and": {
        const w = (c) => (c.t === "or" ? "(" + words(c) + ")" : words(c));
        return w(n.a) + " AND " + w(n.b);
      }
      case "or": return words(n.a) + " OR " + words(n.b);
    }
  }

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Algebra form as TeX for KaTeX. Groups typed by the student keep their brackets.
  // Ungrouped trees from the engine get the brackets precedence needs.
  function tex(n) {
    switch (n.t) {
      case "v": return n.v;
      case "c": return String(n.v);
      case "grp": return "(" + tex(n.a) + ")";
      case "not": {
        let a = n.a;
        while (a.t === "grp") a = a.a;
        return "\\overline{" + tex(a) + "}";
      }
      case "and": {
        const w = (c) => (c.t === "or" ? "(" + tex(c) + ")" : tex(c));
        return w(n.a) + " \\cdot " + w(n.b);
      }
      case "or": return tex(n.a) + " + " + tex(n.b);
    }
  }

  // ---------- identity laws ----------
  const V = (v) => ({ t: "v", v });
  const N = (a) => ({ t: "not", a });
  const A = (a, b) => ({ t: "and", a, b });
  const O = (a, b) => ({ t: "or", a, b });
  const C = (v) => ({ t: "c", v });
  const eq = (x, y) => key(x) === key(y);
  const isC = (n, v) => n.t === "c" && n.v === v;
  const isNot = (n, x) => n.t === "not" && eq(n.a, x);

  const LAWS = [
    { id: "identity", name: "Identity law" },
    { id: "null", name: "Null law" },
    { id: "idempotent", name: "Idempotent law" },
    { id: "inverse", name: "Inverse law" },
    { id: "commutative", name: "Commutative law" },
    { id: "associative", name: "Associative law" },
    { id: "distributive", name: "Distributive law" },
    { id: "absorption", name: "Absorption law" },
    { id: "demorgan", name: "De Morgan's law" },
    { id: "double", name: "Double negation" },
  ];

  function rewrites(n, law) {
    const r = [];
    const { t, a, b } = n;
    const bin = t === "and" || t === "or";
    const dual = t === "and" ? "or" : "and";
    const mk = (tt, x, y) => ({ t: tt, a: x, b: y });

      case "identity":
        if (t === "and") { if (isC(b, 1)) r.push(a); if (isC(a, 1)) r.push(b); }
        if (t === "or") { if (isC(b, 0)) r.push(a); if (isC(a, 0)) r.push(b); }
        break;
      case "null":
        if (t === "and" && (isC(a, 0) || isC(b, 0))) r.push(C(0));
        if (t === "or" && (isC(a, 1) || isC(b, 1))) r.push(C(1));
        break;
      case "idempotent":
        if (bin && eq(a, b)) r.push(a);
        break;
      case "inverse":
        if (bin && (isNot(b, a) || isNot(a, b))) r.push(C(t === "and" ? 0 : 1));
        break;
      case "commutative":
        if (bin) r.push(mk(t, b, a));
        break;
      case "associative":
        if (bin && a.t === t) r.push(mk(t, a.a, mk(t, a.b, b)));
        if (bin && b.t === t) r.push(mk(t, mk(t, a, b.a), b.b));
        break;
      case "distributive":
        if (bin) {
          // x op (y dual z) -> (x op y) dual (x op z), and the mirror
          if (b.t === dual) r.push(mk(dual, mk(t, a, b.a), mk(t, a, b.b)));
          if (a.t === dual) r.push(mk(dual, mk(t, a.a, b), mk(t, a.b, b)));
          // factor: (x d y) op (x d z) -> x d (y op z), and the mirror
          if (a.t === dual && b.t === dual) {
            if (eq(a.a, b.a)) r.push(mk(dual, a.a, mk(t, a.b, b.b)));
            if (eq(a.b, b.b)) r.push(mk(dual, mk(t, a.a, b.a), a.b));
          }
        }
        break;
      case "absorption":
        if (bin) {
          const absorbs = (x, y) => y.t === dual && (eq(y.a, x) || eq(y.b, x));
          if (absorbs(a, b)) r.push(a);
          if (absorbs(b, a)) r.push(b);
        }
        break;
      case "demorgan":
        if (t === "not" && (a.t === "and" || a.t === "or"))
          r.push(mk(a.t === "and" ? "or" : "and", N(a.a), N(a.b)));
        if (bin && a.t === "not" && b.t === "not") r.push(N(mk(dual, a.a, b.a)));
        break;
      case "double":
        if (t === "not" && a.t === "not") r.push(a.a);
        break;
    }
    return r;
  }

  function applyOnce(n, law) {
    const out = rewrites(n, law);
    if (n.t === "not") for (const x of applyOnce(n.a, law)) out.push(N(x));
    if (n.t === "and" || n.t === "or") {
      for (const x of applyOnce(n.a, law)) out.push({ t: n.t, a: x, b: n.b });
      for (const x of applyOnce(n.b, law)) out.push({ t: n.t, a: n.a, b: x });
    }
    return out;
  }

  // Every tree reachable by applying one law one or more times.
  function reach(start, law, depth = 4, cap = 4000) {
    const seen = new Map();
    let frontier = [start];
    for (let d = 0; d < depth && frontier.length; d++) {
      const next = [];
      for (const n of frontier)
        for (const m of applyOnce(n, law)) {
          const k = key(m);
          if (!seen.has(k)) { seen.set(k, m); next.push(m); }
          if (seen.size > cap) return seen;
        }
      frontier = next;
    }
    return seen;
  }

  // Result: ok, same, noteq, order, law
  function checkStep(prevAst, nextAst, law) {
    const p = strip(prevAst), n = strip(nextAst);
    if (key(p) === key(n)) return "same";
    if (!equivalent(p, n)) return "noteq";
    const r = reach(p, law);
    if (r.has(key(n))) return "ok";
    if (law !== "commutative") {
      const sk = sortedKey(n);
      for (const m of r.values()) if (sortedKey(m) === sk) return "order";
    }
    return "law";
  }

  return { parse, strip, key, sortedKey, equivalent, size, barsOnLetters, words, tex, checkStep, LAWS, evalAt, vars, V, N, A, O, C };
})();
if (typeof module !== "undefined") module.exports = Bool;

</script>

  return Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, pyPrelude(password, confirm) + code, true))

  const pw = state.pw;
  // The student's line 1 comes right after the prelude.
  const offset = pyPrelude(pw.password, pw.confirm).split("\n").length - 1;
  running = true;
  render();
  runCase(pw.code, pw.password, pw.confirm)
    .then(async (r) => {
      pw.result = r.warned && r.succeeded ? "both" : r.warned ? "fail" : r.succeeded ? "ok" : "none";
      pw.err = "";
      pw.passes = await passesAll(pw.code).catch(() => false);
    })
    .catch((e) => {
      let msg = String(e && e.toString ? e.toString() : e);
      msg = msg.replace(/on line (\d+)/, (_, n) => "on line " + Math.max(1, n - offset));
      const tb = e && e.traceback && e.traceback[0];
      if (tb && !/on line/.test(msg)) msg += " on line " + Math.max(1, tb.lineno - offset);
      if (/TimeLimitError/.test(msg)) msg = "The code ran too long. Check for a loop that never ends.";
      pw.result = "";
      pw.err = msg;
      pw.passes = false;
    })
    .finally(() => { running = false; commit(); });
}

// Python syntax highlighting for the editor.
const PY_RE = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|\b(def|return|if|elif|else|for|while|in|not|and|or|is|import|from|as|pass|break|continue|class|lambda|try|except|finally|with|global|del|assert|raise)\b|\b(True|False|None|\d+(?:\.\d+)?)\b|\b(len|print|range|int|str|float|input|bool|list|abs|min|max|sum|show_warning|show_success)\b(?=\()|\b([A-Za-z_]\w*)(?=\()/g;
function highlightPy(code) {
  let out = "", last = 0, m, afterDef = false;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(code))) {
    out += esc(code.slice(last, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="c">${t.replace(/\bTODO\b/, "<b>TODO</b>")}</span>`;
    else if (m[2]) out += `<span class="s">${t}</span>`;
    else if (m[3]) out += `<span class="k">${t}</span>`;
    else if (m[4]) out += `<span class="n">${t}</span>`;
    else if (m[5]) out += `<span class="b">${t}</span>`;
    else out += afterDef ? `<span class="f">${t}</span>` : t;
    afterDef = m[3] === "def";
    last = m.index + m[0].length;
  }
  // A trailing newline keeps the copy as tall as the textarea's last line.
  return out + esc(code.slice(last)) + "\n";
}
function syncHighlight() {
  const pre = $app.querySelector(".hl");
  const ta = $app.querySelector("textarea.code");
  if (!pre || !ta) return;
  pre.innerHTML = highlightPy(ta.value);
  pre.scrollTop = ta.scrollTop;
  pre.scrollLeft = ta.scrollLeft;
}
document.addEventListener("scroll", (e) => { if (e.target.classList && e.target.classList.contains("code")) syncHighlight(); }, true);

// Drag handling for the circuit board.
let drag = null;
function svgPoint(evt) {
  const svg = document.getElementById("board");
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
function overPalette(evt) {
  const p = document.getElementById("palette");
  if (!p) return false;
  const r = p.getBoundingClientRect();
  return evt.clientX >= r.left && evt.clientX <= r.right && evt.clientY >= r.top && evt.clientY <= r.bottom;
}
function nextGateId() {
  let n = 1;
  while (state.circ.gates["g" + n]) n++;
  return "g" + n;
}
function clampGate(x, y) {
  return [Math.round(Math.min(BOARD.out.x - 190, Math.max(110, x))), Math.round(Math.min(BOARD.h - 80, Math.max(20, y)))];
}
function onBoardDown(evt) {
  if (phase !== 6 || !document.getElementById("board")) return;
  const t = evt.target;
  const neu = t.closest && t.closest("[data-new]");
  const out = t.closest && t.closest("[data-out]");
  const gate = t.closest && t.closest("[data-gate]");
  if (neu) {
    evt.preventDefault();
    const id = nextGateId();
    const p = svgPoint(evt);
    state.circ.gates[id] = { type: neu.dataset.new, x: Math.round(p.x - 40), y: Math.round(p.y - 30) };
    render();
    drag = { kind: "gate", id, dx: 40, dy: 30, isNew: true };
  } else if (out) {
    evt.preventDefault();
    drag = { kind: "wire", src: out.dataset.out };
  } else if (gate && gate.dataset.gate && !t.closest("[data-in]")) {
    evt.preventDefault();
    const G = state.circ.gates[gate.dataset.gate];
    const p = svgPoint(evt);
    drag = { kind: "gate", id: gate.dataset.gate, dx: p.x - G.x, dy: p.y - G.y };
  }
}
function onBoardMove(evt) {
  if (!drag) return;
  const p = svgPoint(evt);
  if (drag.kind === "gate") {
    const G = state.circ.gates[drag.id];
    if (!G) return;
    G.x = Math.round(p.x - drag.dx); G.y = Math.round(p.y - drag.dy);
    const pal = document.getElementById("palette");
    pal && pal.classList.toggle("trash", overPalette(evt) && !drag.isNew);
    patchBoard();
  } else {
    const svg = document.getElementById("board");
    let tmp = document.getElementById("tmpwire");
    if (!tmp) { tmp = document.createElementNS("http://www.w3.org/2000/svg", "path"); tmp.id = "tmpwire"; tmp.setAttribute("class", "wire live"); tmp.setAttribute("pointer-events", "none"); svg.appendChild(tmp); }
    const s = drag.src;
    const a = BOARD.inputs[s] ? [BOARD.inputs[s][0] + 22, BOARD.inputs[s][1]] : [state.circ.gates[s].x + OUT[0], state.circ.gates[s].y + OUT[1]];
    tmp.setAttribute("d", wirePath(a[0], a[1], p.x, p.y));
  }
}
function onBoardUp(evt) {
  if (!drag) return;
  const d = drag;
  drag = null;
  if (d.kind === "gate") {
    const G = state.circ.gates[d.id];
    if (G) {
      if (overPalette(evt)) {
        delete state.circ.gates[d.id];
        for (const [k, v] of Object.entries(state.circ.wires)) if (v === d.id || k.startsWith(d.id + ":")) delete state.circ.wires[k];
      } else [G.x, G.y] = clampGate(G.x, G.y);
    }
    commit();
  } else {
    const el = document.elementFromPoint(evt.clientX, evt.clientY);
    const tgt = el && el.closest && el.closest("[data-in]");
    if (tgt) {
      const port = tgt.dataset.in;
      if (port.split(":")[0] !== d.src) {
        state.circ.wires[port] = d.src;
        commit();
        return;
      }
    }
    render(true);
  }
}
function patchBoard() {
  const wrap = document.getElementById("boardwrap");
  const svg = document.getElementById("board");
  if (!wrap || !svg) return;
  const L = { ...BOARD, gates: state.circ.gates, wires: state.circ.wires };
  svg.outerHTML = circuitSVG(L, true);
}

// ---------- Phase 7: Practice ----------
const QS = [
  { id: "q0", s: "NOT (NOT A OR B)", ans: "A AND NOT B" },
  { id: "q1", s: "NOT (A AND NOT B)", ans: "NOT A OR B" },
  { id: "q2", s: "NOT (NOT A AND NOT B)", ans: "A OR B" },
  { id: "q3", s: "A AND NOT (NOT A OR B)", ans: "A AND NOT B" },
  { id: "q4", s: "NOT (A OR B) OR NOT B", ans: "NOT B" },
  { id: "q5", s: "NOT (A AND B) AND A", ans: "NOT B AND A" },
  { id: "x0", s: "NOT (A OR B OR C)", ans: "NOT A AND NOT B AND NOT C", extra: true },
  { id: "x1", s: "NOT (A AND NOT (B OR C))", ans: "NOT A OR B OR C", extra: true },
  { id: "x2", s: "NOT (NOT A AND B OR C)", ans: "(A OR NOT B) AND NOT C", extra: true },
];
const LAWNAME = Object.fromEntries(Bool.LAWS.map((l) => [l.id, l.name]));
const qVars = (q) => [...Bool.vars(P(q.s))].sort();
const work = (st, id) => merge({ lines: [], draft: "", law: "", bad: false, fb: "" }, st.prac.work[id]);
function lastAst(q, w) {
  return w.lines.length ? P(w.lines[w.lines.length - 1].text) : P(q.s);
}
function qDone(q, w) {
  if (!w.lines.length) return false;
  const a = lastAst(q, w);
  return !!a && Bool.barsOnLetters(a) && Bool.size(a) <= Bool.size(P(q.ans));
}
function practiceDone(st) {
  return QS.filter((q) => !q.extra).every((q) => qDone(q, work(st, q.id)));
}
const FB = {
  noteq: ["bad", () => "This line is not equal to the line above."],
  same: ["warn", () => "This line is the same as the line above."],
  order: ["warn", () => "This line is equal, but the order changed. Reordering needs the commutative law on its own line."],
  law: ["warn", (law) => `This line is equal, but the ${LAWNAME[law] ? LAWNAME[law].replace(/ law$/, "") + (law === "double" ? "" : " law") : "chosen identity"} alone does not get you here.`],
};
function viewPrac() {
  if (isTeacher()) return viewPracTeacher();
  const st = state;
  const showExtra = practiceDone(st);
  const visible = QS.filter((q) => !q.extra || showExtra);
  let cur = QS.find((q) => q.id === st.prac.cur && (!q.extra || showExtra)) || QS[0];
  const w = work(st, cur.id);
  const done = qDone(cur, w);
  const vars = qVars(cur);
  const lines = w.lines.map((l, i) => `<div class="pline"><span>${alg(l.text)}</span><span class="law">${esc(LAWNAME[l.law] || "")}</span><span class="ok">${i === w.lines.length - 1 && !done ? `<button data-act="pundo" aria-label="Undo" style="color:var(--soft);width:32px;height:32px;padding:4px">${I.undo}</button>` : I.check.replace("<svg", '<svg width="26" height="26"')}</span></div>`).join("");
  let draft = "";
  if (!done) {
    const path = `prac.work.${cur.id}`;
    const sel = `<select data-bind="${path}.law" data-key="${path}.law" data-clear="${path}.fb"><option value="">Identity</option>${Bool.LAWS.map((l) => `<option value="${l.id}">${l.name}</option>`).join("")}</select>`;
    const can = w.draft.trim() && w.law;
    const fb = w.fb && FB[w.fb] ? `<div class="fbk ${FB[w.fb][0]}">${esc(FB[w.fb][1](w.law))}</div>` : "";
    draft = `<div class="draft">${exInputDraft(path, w, vars, sel, can)}${fb}</div>`;
  }
  return `<div class="stage">
    <div class="dots">${visible.map((q, i) => `<button class="${q.id === cur.id ? "on" : ""} ${qDone(q, work(st, q.id)) ? "done" : ""} ${q.extra ? "extra" : ""}" data-act="pq" data-id="${q.id}">${q.extra ? "★" : i + 1}</button>`).join("")}</div>
    <div class="card prac ${done ? "donecard" : ""}">
      <div class="lines"><div class="pline start"><span>${alg(cur.s)}</span><span></span><span></span></div>${lines}</div>
      ${draft}
    </div>
  </div>`;
}
function exInputDraft(path, w, vars, sel, can) {
  return exInput(path, { text: w.draft, done: false, bad: w.bad }, vars, { consts: true, noConfirm: true, enter: "pcheck", key: path + ".draft", bind: path + ".draft", clear: path + ".bad," + path + ".fb", extra: sel + `<button class="btn primary" data-act="pcheck" ${can ? "" : "disabled"}>Check</button>` });
}
function viewPracTeacher() {
  if (!live()) return `<div class="stage"><div class="card prac"><div class="lines">${QS.filter((q) => !q.extra).map((q) => `<div class="pline start"><span>${alg(q.s)}</span><span></span><span></span></div>`).join("")}</div></div></div>`;
  const studs = Object.values(ctx.students);
  const rows = QS.map((q, i) => {
    let fin = 0;
    const mistakes = new Map();
    for (const s of studs) {
      const st = merge(DEFAULTS, s.state);
      if (qDone(q, work(st, q.id))) fin++;
      const seen = new Set();
      for (const m of st.prac.log || []) {
        if (m.q !== q.id || m.r === "same") continue;
        const k = m.r === "noteq" ? "noteq" : m.r + ":" + m.law;
        if (seen.has(k)) continue;
        seen.add(k);
        mistakes.set(k, (mistakes.get(k) || 0) + 1);
      }
    }
    const top = [...mistakes.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2);
    const desc = (k) => {
      if (k === "noteq") return "Line not equal";
      const [r, law] = k.split(":");
      return r === "order" ? "Reordered without commutative" : `${LAWNAME[law] || "Identity"} chosen wrongly`;
    };
    return `<tr><td style="font-size:28px">${q.extra ? "★ " : ""}${alg(q.s)}</td><td class="n">${outOf(fin)}</td><td class="small">${top.map(([k, n]) => `<div>${esc(desc(k))} <b>${n}</b></div>`).join("")}</td></tr>`;
  }).join("");
  return `<div class="stage"><div class="card" style="width:100%;max-width:1100px"><table class="sum"><tr><th></th><th style="text-align:right">Finished</th><th>Common mistakes</th></tr>${rows}</table></div></div>`;
}
function practiceCheck() {
  const cur = QS.find((q) => q.id === state.prac.cur) || QS[0];
  const path = `prac.work.${cur.id}`;
  const w = work(state, cur.id);
  const r = Bool.parse(w.draft, [...qVars(cur)]);
  if (!r.ast) { w.bad = true; setPath(state, path, w); commit(); return; }
  if (!w.law) return;
  const res = Bool.checkStep(lastAst(cur, w), r.ast, w.law);
  if (res === "ok") {
    w.lines.push({ text: Bool.words(r.ast), law: w.law });
    w.draft = ""; w.law = ""; w.fb = ""; w.bad = false;
  } else {
    w.fb = res;
    state.prac.log = (state.prac.log || []).concat([{ q: cur.id, law: w.law, r: res }]).slice(-60);
  }
  setPath(state, path, w);
  commit();
}

    }
    return `<div class="stage">${seg}<div class="big">${alg(EXIT_Q)}</div>
      <div class="row">${live() ? `<span class="stat"><b>${outOf(answered)}</b><span>submitted</span></span>` : ""}<button class="btn ${state.conc.shown ? "on" : ""}" data-act="cshow">${I.eye}Answers</button></div>
      ${summary}</div>`;
  }
  if (!tc.exitOpen) return viewRecap();
  const ex = state.exit;
  const lines = (ex.lines || []).map((l, i) => `<div class="pline" style="grid-template-columns:1fr 44px">${exInput(`exit.lines.${i}`, merge({ text: "", done: false, bad: false }, l), ["A", "B", "C"], { consts: true })}<button data-act="exdel" data-i="${i}" aria-label="Remove line" style="color:var(--soft)">${I.trash}</button></div>`).join("");
  const showFb = ex.sub && ex.sub === ex.answer;
  const g = showFb ? exitGrade(ex.sub) : "";
  const fb = g === "y" ? `<div class="fbk good">That's it. Well done.</div>`
    : g === "e" ? `<div class="fbk warn">That's equal to the question. Can you simplify it further?</div>`
    : g === "n" ? `<div class="fbk warn">Not quite yet. Try removing one bar at a time.</div>` : "";
  const ans = { text: ex.answer, done: false, bad: ex.bad };
  const ansHtml = exInput("exit", ans, ["A", "B", "C"], { consts: true, noConfirm: true, enter: "esubmit", key: "exit.answer", bind: "exit.answer", clear: "exit.bad", extra: `<button class="btn primary" data-act="esubmit" ${ex.answer.trim() ? "" : "disabled"}>Submit</button>` });
  return `<div class="stage">
    <div class="big">${alg(EXIT_Q)}</div>
    <div class="card prac">
      <div class="lines">${lines}<div><button class="btn" data-act="exadd" aria-label="Add a line of working" data-tip="Add a line of working">${I.plus}</button></div></div>
      <div class="draft" style="border-style:solid;border-color:var(--accent)">${ansHtml}${fb}</div>
    </div>
  </div>`;
}

// ---------- Task lines ----------
// What the student should do in each phase. Shown on the teacher's screen too, since it is projected.
const TASKS = [
  () => null,
  () => ['"I do not have a mango or a pear."'],
  () => ["Fill in the truth table to check who was right.", "Tap a cell to switch between 0 and 1."],
  () => ["Which expression, 1 or 2, equals the NOR expression?"],
  () => null,
  () => null,
  () => ["Build A AND B using only OR and NOT gates."],
  () => ["Simplify the expression one line at a time."],
  () => ((isTeacher() ? state.conc.view === "exit" : T().conc.exitOpen) ? ["Simplify this expression."] : null),
];
function taskHTML() {
  const t = TASKS[phase] && TASKS[phase]();
  return t ? `<div class="task"><b>${esc(t[0])}</b>${t[1] ? `<span>${esc(t[1])}</span>` : ""}</div>` : "";
}

// ---------- Render ----------
const VIEWS = [viewWarm, viewPredict, viewTT, viewNor, viewNand, viewPw, viewCirc, viewPrac, viewConc];
function render(force) {
  let html;
  try { html = taskHTML() + (VIEWS[phase] || VIEWS[0])(); }
  catch (e) { html = `<div class="stage"><div class="pyerr">${esc(e && e.stack || e)}</div></div>`; }
  if (force || html !== lastHtml) {
    const a = document.activeElement;
    const key = a && a.dataset ? a.dataset.key : null;
    const sel = key && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
    const scroll = {};
    $app.querySelectorAll("textarea[data-key]").forEach((t) => (scroll[t.dataset.key] = t.scrollTop));
    $app.innerHTML = `<div id="fit">${html}</div>`;
    lastHtml = html;
    if (key) {
      const el = $app.querySelector(`[data-key="${CSS.escape(key)}"]`);
      if (el) {
        syncValues();
        el.focus({ preventScroll: true });
        if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (_) {}
      }
    }
    $app.querySelectorAll("textarea[data-key]").forEach((t) => { if (scroll[t.dataset.key] != null) t.scrollTop = scroll[t.dataset.key]; });
  }
  syncValues();
  syncHighlight();
  renderNav();
  fit();
}
// Scale the 1280 wide layout to the window. Leaves room for the status bar above and the phase arrows below.
const TOP = 56, BOTTOM = 80, MIN_SCALE = 0.5, MAX_SCALE = 1.6;
function fit() {
  const el = document.getElementById("fit");
  if (!el) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  if (!w || !h) return;
  const s = Math.max(MIN_SCALE, Math.min(MAX_SCALE, (window.innerWidth - 32) / w, (window.innerHeight - TOP - BOTTOM) / h));
  el.style.transform = `scale(${s})`;
  // A transform does not change layout, so set the space the scaled page takes.
  el.style.marginBottom = `${h * (s - 1)}px`;
}
window.addEventListener("resize", fit);
function syncValues() {
  $app.querySelectorAll("input[data-bind], textarea[data-bind], select[data-bind]").forEach((el) => {
    const v = getPath(state, el.dataset.bind) ?? "";
    if (el.value !== v) el.value = v;
  });
}
function renderNav() {
  if (!isTeacher()) { $nav.classList.add("hidden"); return; }
  $nav.classList.remove("hidden");
  $nav.innerHTML = `<button class="btn icon" data-nav="-1" ${phase <= 0 ? "disabled" : ""} aria-label="Back">${I.left}</button>
    <div class="pips">${Array.from({ length: NPHASES }, (_, i) => `<span class="pip ${i === phase ? "on" : ""}"></span>`).join("")}</div>
    <button class="btn icon" data-nav="1" ${phase >= NPHASES - 1 || (maxPhase !== null && phase >= maxPhase) ? "disabled" : ""} aria-label="Next">${I.right}</button>`;
}
// The Conductor turns a student's thumbnail green while $done is true. Phases with no single goal leave it out.
function doneNow() {
  switch (phase) {
    case 2: return pad4(state.tt.target) === "1000";
    case 4: return T().nand.mode === "pick" ? state.nand.pick === "o1" : !!state.nand.done && nandGrade(state.nand.text) === "y";
    case 5: return !!state.pw.passes;
    case 6: return circSolved(state.circ);
    case 7: return practiceDone(state);
    case 8: return !!state.exit.sub && exitGrade(state.exit.sub) === "y";
    default: return undefined;
  }
}
function send() {
  const d = isTeacher() ? undefined : doneNow();
  if (d === undefined) delete state.$done;
  else state.$done = d;
  host.update(state, phase);
}
function commit() {
  render();
  send();
}
function setPhase(p) {
  let n = Math.max(0, Math.min(NPHASES - 1, p | 0));
  if (maxPhase !== null) n = Math.min(n, maxPhase);
  if (n === phase) return;
  phase = n;
  lastHtml = "";
  commit();
  publishFilters();
}

// ---------- Slideshow cues ----------
// The Conductor replays every cue from the start of the phase up to the current step, so each cue is a setter.
// fresh is false on a replay: no new randomness.
function resetPresentation(p) {
  if (p === 0) Object.assign(state.warm, { round: -1, q: -1, shown: false });
  if (p === 1) Object.assign(state.predict, { ex: 0, shown: {}, hide: false });
  if (p === 2) Object.assign(state.tt, { reveal: false, answer: false });
  if (p === 3) Object.assign(state.nor, { t: "1000", o1: "----", o2: "----", theorem: false });
  if (p === 4) Object.assign(state.nand, { step: 0, mode: "type", shown: false, table: false });
  if (p === 6) state.circ.showCount = false;
  if (p === 8) Object.assign(state.conc, { view: "cards", exitOpen: false, shown: false });
}
const evalCol = (e) => ROWS.map(([a, b]) => Bool.evalAt(P(e), { A: a, B: b })).join("");
function applyCue(name, fresh) {
  const [cmd, arg] = [name.split(" ")[0], name.split(" ").slice(1).join(" ")];
  const w = state.warm;
  switch (cmd) {
    case "deal":
      w.round = "ABC".indexOf(arg); w.q = -1; w.shown = true;
      if (fresh) w.deal = (w.deal | 0) + 1;
      break;
    case "question": w.q = +arg - 1; break;
    case "example": state.predict.ex = +arg - 1; break;
    case "results": {
      const e = "e" + (state.predict.ex | 0);
      state.predict.shown[e] = true;
      if (live()) { const v = votesFor(e); state.predict.counts[e] = { t: v.t.length, f: v.f.length }; }
      break;
    }
    case "answer": state.tt.answer = true; break;
    case "nor": state.tt.reveal = true; break;
    case "theorem": state.nor.theorem = true; break;
    case "fill": {
      const o = NOR_OUTS.find((x) => x.tag === arg);
      if (o) state.nor[o.k] = evalCol(o.e);
      break;
    }
    case "type": state.nand.mode = "type"; break;
    case "ask": state.nand.step = 1; break;
    case "answer": state.nand.step = 2; break;
    case "choices": state.nand.mode = "pick"; break;
    case "answers": state.nand.shown = true; break;
    case "count": state.circ.showCount = true; break;
    case "takeaways": state.conc.view = "cards"; break;
    case "exit": state.conc.view = "exit"; state.conc.exitOpen = true; break;
  }
  if (name === "exit answers") state.conc.shown = true;
}
// Runs one slideshow step in the teacher's frame: move to the phase, rebuild its presentation, apply the cues.
function runSlide({ phase: p, cues }) {
  if (!isTeacher()) return;
  setPhase(p | 0);
  resetPresentation(phase);
  for (const c of cues || []) applyCue(String(c.name || ""), !!c.fresh);
  commit();
  publishFilters();
}

// ---------- Class tools ----------
function publishFilters() {
  if (!live()) return;
  let f = [];
  if (phase === 1) {
    const e = "e" + (state.predict.ex | 0);
    if (state.predict.shown[e]) {
      const v = votesFor(e);
      f = [{ name: "True", students: v.t }, { name: "False", students: v.f }].filter((x) => x.students.length);
    }
  }
  host.filters?.(f);
}
function syncCounts() {
  if (!live() || phase !== 1) return;
  const e = "e" + (state.predict.ex | 0);
  if (!state.predict.shown[e]) return;
  const v = votesFor(e);
  const c = { t: v.t.length, f: v.f.length };
  const old = state.predict.counts[e] || {};
  if (old.t !== c.t || old.f !== c.f) {
    state.predict.counts[e] = c;
    send();
  }
}

// ---------- Actions ----------
const ACT = {
  round(el) { state.warm.round = +el.dataset.i; state.warm.q = -1; state.warm.shown = false; commit(); },
  wq(el) { const w = state.warm; w.q = Math.max(-1, Math.min(1, w.q + +el.dataset.d)); commit(); },
  deal() { state.warm.deal = (state.warm.deal | 0) + 1; state.warm.shown = true; commit(); },
  pick() { host.wheel?.({ filter: "", spin: true }); },
  spin(el) { host.wheel?.({ filter: el.dataset.f, spin: true }); },
  ex(el) { state.predict.ex = +el.dataset.i; commit(); publishFilters(); },
  phide() { state.predict.hide = !state.predict.hide; commit(); },
  reveal() {
    const e = "e" + (state.predict.ex | 0);
    state.predict.shown[e] = true;
    if (live()) { const v = votesFor(e); state.predict.counts[e] = { t: v.t.length, f: v.f.length }; }
    commit(); publishFilters();
  },
  vote(el) {
    const e = "e" + (T().predict.ex | 0);
    if (state.predict.votes[e]) return;
    state.predict.votes[e] = el.dataset.v; commit();
  },
  ttadd() { state.tt.cols.push({ text: "", done: false, bad: false, vals: "----" }); commit(); const i = state.tt.cols.length - 1; const el = $app.querySelector(`[data-key="tt.cols.${i}"]`); el && el.focus(); },
  ttdel(el) { state.tt.cols.splice(+el.dataset.i, 1); commit(); },
  ttcell(el) {
    const r = +el.dataset.r;
    if (el.dataset.c === "t") state.tt.target = setChar(pad4(state.tt.target), r, cyc(pad4(state.tt.target)[r]));
    else { const c = state.tt.cols[+el.dataset.c]; c.vals = setChar(pad4(c.vals), r, cyc(pad4(c.vals)[r])); }
    commit();
  },
  ttanswer() { state.tt.answer = !state.tt.answer; commit(); },
  ttreveal() { state.tt.reveal = !state.tt.reveal; commit(); },
  northeorem() { state.nor.theorem = !state.nor.theorem; commit(); },
  dimcol(el) { setPath(state, el.dataset.path, !getPath(state, el.dataset.path)); commit(); },
  fillcol(el) {
    const vars = el.dataset.v.split("");
    const ast = Bool.parse(el.dataset.e, vars).ast;
    if (!ast) return;
    setPath(state, el.dataset.path, ROWS.map(([a, b]) => Bool.evalAt(ast, { [vars[0]]: a, [vars[1]]: b })).join(""));
    commit();
  },
  noradd() { state.nor.cols.push({ text: "", done: false, bad: false, vals: "----" }); commit(); const i = state.nor.cols.length - 1; const el = $app.querySelector(`[data-key="nor.cols.${i}"]`); el && el.focus(); },
  nordel(el) { state.nor.cols.splice(+el.dataset.i, 1); commit(); },
  norcell(el) {
    const r = +el.dataset.r, c = el.dataset.c;
    if (/^\d+$/.test(c)) { const col = state.nor.cols[+c]; col.vals = setChar(pad4(col.vals), r, cyc(pad4(col.vals)[r])); }
    else state.nor[c] = setChar(pad4(state.nor[c]), r, cyc(pad4(state.nor[c])[r]));
    commit();
  },
  cbcell(el) {
    const cells = getPath(state, el.dataset.path);
    const k = el.dataset.k, r = +el.dataset.r;
    cells[k] = setChar(pad4(cells[k]), r, cyc(pad4(cells[k])[r]));
    commit();
  },
  exconfirm(el) {
    const path = el.dataset.path;
    const obj = getPath(state, path);
    if (!obj || !obj.text.trim()) return;
    const vars = path.startsWith("tt.") ? ["M", "P"] : path.startsWith("nand") || path.startsWith("nor") ? ["A", "B"] : ["A", "B", "C"];
    const r = Bool.parse(obj.text, vars);
    if (r.ast) { obj.done = true; obj.bad = false; } else obj.bad = true;
    commit();
  },
  exedit(el) {
    const obj = getPath(state, el.dataset.path);
    if (!obj) return;
    obj.done = false;
    commit();
    const inp = $app.querySelector(`[data-key="${CSS.escape(el.dataset.path)}"]`);
    if (inp) { carets[el.dataset.path] = mxTokens(obj.text).length; focusedMx = el.dataset.path; inp.focus(); render(); }
  },
  nandstep(el) { state.nand.step = +el.dataset.s; commit(); },
  nandmode(el) { state.nand.mode = el.dataset.m; state.nand.shown = false; commit(); },
  nandshow() { state.nand.shown = !state.nand.shown; commit(); },
  nandtable() { state.nand.table = !state.nand.table; commit(); },
  nandpick(el) { state.nand.pick = el.dataset.k; commit(); },
  signup() { runPython(); },
  helper() { helperOpen = !helperOpen; render(true); },
  pwreset() { state.pw.code = DEFAULT_CODE; state.pw.result = ""; state.pw.err = ""; state.pw.passes = false; commit(); },
  circcount() { state.circ.showCount = !state.circ.showCount; commit(); },
  pq(el) { state.prac.cur = el.dataset.id; commit(); },
  pcheck() { practiceCheck(); },
  pundo() {
    const cur = QS.find((q) => q.id === state.prac.cur) || QS[0];
    const w = work(state, cur.id);
    const last = w.lines.pop();
    if (last) { w.draft = last.text; w.law = last.law; w.fb = ""; }
    setPath(state, `prac.work.${cur.id}`, w);
    commit();
  },
  flip(el) { const k = "t" + el.dataset.i; state.conc.flipped[k] = !state.conc.flipped[k]; commit(); },
  cview(el) { state.conc.view = el.dataset.v; if (el.dataset.v === "exit") state.conc.exitOpen = true; commit(); },
  cshow() { state.conc.shown = !state.conc.shown; commit(); },
  exadd() { state.exit.lines = (state.exit.lines || []).concat([{ text: "", done: false, bad: false }]); commit(); const el = $app.querySelector(`[data-key="exit.lines.${state.exit.lines.length - 1}"]`); el && el.focus(); },
  exdel(el) { state.exit.lines.splice(+el.dataset.i, 1); commit(); },
  esubmit() {
    const r = Bool.parse(state.exit.answer, ["A", "B", "C"]);
    if (!r.ast) { state.exit.bad = true; commit(); return; }
    state.exit.sub = state.exit.answer; state.exit.bad = false; commit();
  },
};

document.addEventListener("mousedown", (e) => { if (e.target.closest("[data-tok]")) e.preventDefault(); });
document.addEventListener("click", (e) => {
  const nav = e.target.closest("[data-nav]");
  if (nav && !nav.disabled) { setPhase(phase + +nav.dataset.nav); return; }
  const tok = e.target.closest("[data-tok]");
  if (tok) { insertToken(tok.dataset.for, tok.dataset.tok); return; }
  const w = e.target.closest("[data-wire]");
  if (w && phase === 6) { delete state.circ.wires[w.dataset.wire]; commit(); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!el.dataset || !el.dataset.bind) return;
  setPath(state, el.dataset.bind, el.value);
  clearPaths(el.dataset.clear);
  commit();
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.tagName === "SELECT" && el.dataset.bind) {
    setPath(state, el.dataset.bind, el.value);
    clearPaths(el.dataset.clear);
    commit();
  }
});
document.addEventListener("keydown", (e) => {
  if (mxKey(e)) return;
  const el = e.target;
  if (e.key === "Enter" && el.classList && el.classList.contains("ex-in")) {
    e.preventDefault();
    const act = el.dataset.enter;
    if (act === "exconfirm") ACT.exconfirm(el);
    else if (ACT[act]) ACT[act](el);
  }
  if (e.key === "Tab" && el.classList && el.classList.contains("code")) {
    e.preventDefault();
    const s = el.selectionStart, en = el.selectionEnd;
    el.value = el.value.slice(0, s) + "    " + el.value.slice(en);
    el.setSelectionRange(s + 4, s + 4);
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }
});
document.addEventListener("pointerdown", onBoardDown);
document.addEventListener("pointermove", onBoardMove);
document.addEventListener("pointerup", onBoardUp);

// ---------- Host wiring ----------
const newSeed = () => Math.random().toString(36).slice(2, 10);
// Each student deals their own warm-up. A Handoff copies the teacher's seed, so replace it.
function ownSeed() {
  if (!booted || ctx.role !== "student" || !ctx.teacher || !ctx.teacher.state) return;
  if (state.me && state.me !== ctx.teacher.state.me) return;
  state.me = newSeed();
  commit();
}
function followTeacher() {
  if (ctx.role !== "student" || typeof lastTeacherPhase !== "number") return;
  let target = lastTeacherPhase;
  if (maxPhase !== null) target = Math.min(target, maxPhase);
  if (target !== phase) { phase = target; lastHtml = ""; send(); }
}
host.connect({
  setState(s, p) {
    gotState = true;
    state = merge(DEFAULTS, s);
    phase = Math.max(0, Math.min(NPHASES - 1, p | 0));
    lastHtml = "";
    render();
    setTimeout(ownSeed);
    // A replayed state carries the phase it was saved at, which can be behind the teacher, for example after a Demo.
    if (booted) setTimeout(followTeacher);
  },
  setPhaseLimit(m) {
    maxPhase = m === null || m === undefined ? null : m | 0;
    if (booted && ctx.role === "student") followTeacher();
    render();
  },
  setContext(c) {
    ctx = { role: "student", teacher: null, students: null, ...(c || {}) };
    const tp = ctx.teacher && typeof ctx.teacher.phase === "number" ? ctx.teacher.phase : undefined;
    if (ctx.role === "student" && tp !== undefined && tp !== lastTeacherPhase) {
      lastTeacherPhase = tp;
      if (booted) followTeacher();
    }
    if (live()) { syncCounts(); publishFilters(); }
    render();
    ownSeed();
  },
  slide(step) { runSlide(step || {}); },
});
if (!gotState) {
  state.me = newSeed();
  if (ctx.role === "student" && typeof lastTeacherPhase === "number") phase = maxPhase !== null ? Math.min(lastTeacherPhase, maxPhase) : lastTeacherPhase;
}
booted = true;
send();
render();
})();
</script>
